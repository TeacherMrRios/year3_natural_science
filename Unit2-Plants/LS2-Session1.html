<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LS2 Session 1 · Plant Quest</title><style>
:root{--fs:20px;--green:#164f32}*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;color:#153c27;background:linear-gradient(135deg,#c7eeb2,#f4ffe9 48%,#b2dfb0);overflow:hidden;font-size:var(--fs)}body:before,body:after{content:'🌿 🍃 🌱 🍀 🌿';position:fixed;font-size:65px;opacity:.16;white-space:nowrap;pointer-events:none;animation:wind 8s ease-in-out infinite alternate;z-index:-1}body:before{top:18%;left:-4%}body:after{bottom:13%;right:-4%;animation-delay:-4s}@keyframes wind{from{transform:translateX(-25px) rotate(-6deg)}to{transform:translateX(25px) rotate(7deg)}}header{display:flex;align-items:center;gap:8px;padding:12px 22px;background:#fffef4;border-bottom:4px solid #6dbb65;min-height:76px}.brand{font-weight:900;color:var(--green);margin-right:auto}button{cursor:pointer;font:inherit;border:0;border-radius:13px;padding:10px 15px;font-weight:800}header button{background:#e5f4db}header button.active{background:#236b42;color:white}nav{display:flex;gap:7px;padding:9px 18px;overflow-x:auto;background:#e7f7dc;min-height:60px}nav button{font-size:.78em;white-space:nowrap;background:white;border:2px solid #c2dfba}nav button.active{background:#276c42;color:white}main{height:calc(100dvh - 212px);max-width:1250px;margin:auto;padding:12px 22px;overflow-y:auto}.slide{display:none;min-height:100%;padding-bottom:20px}.slide.active{display:block}h1{font-size:1.75em;color:#155638;margin:.2em 0 .45em}.intro{font-size:1.12em;line-height:1.5}.eyebrow{display:inline-block;background:#fff4a5;border-radius:99px;padding:7px 13px;font-size:.78em;font-weight:900}.questions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.qcard{background:#fffdf5;border:2px solid #8dc787;border-radius:22px;padding:16px;box-shadow:0 5px 15px #255b2920}.qcard h2{font-size:1.05em;line-height:1.35;margin:0 0 12px}.opts{display:grid;gap:8px}.opts button{background:#edf8e7;border:2px solid #b2d4a9;text-align:left;font-size:.88em;min-height:48px}.opts button:hover{background:#d7efce}.opts button.correct{background:#c0f3bd;border-color:#27974c}.feedback{min-height:1.4em;margin-top:7px;font-size:.85em;font-weight:900}.good{color:#16793d;animation:pop .3s}.bad{color:#b54b20}@keyframes pop{from{transform:scale(.93)}to{transform:scale(1)}}.hero{background:#fffdf4;border-radius:25px;padding:28px;max-width:850px;margin:5vh auto;text-align:center;border:3px solid #92ca84}.hero .emoji{font-size:3em}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summary article{padding:17px;background:white;border-radius:18px;border:2px solid #a6d29d;line-height:1.45}.footer{height:76px;display:flex;align-items:center;justify-content:space-between;padding:10px 24px;background:#fffef5;border-top:3px solid #a3cf9b}.footer button{background:#276b42;color:white;min-width:145px}.footer button:disabled{opacity:.3}.score{font-weight:900;text-align:center}body.large main{height:calc(100dvh - 212px)}body.large .questions{grid-template-columns:1fr}body.large .qcard{max-width:1000px;width:100%;margin:auto}body.large .summary{grid-template-columns:1fr}@media(max-width:760px){header{flex-wrap:wrap}.brand{width:100%}.questions,.summary{grid-template-columns:1fr}main{height:calc(100dvh - 260px)}.footer{height:80px}.footer button{min-width:90px}nav{min-height:55px}}
</style></head><body><header><div class="brand">🌱 Plant Quest · Mr. Ríos</div><button data-lang="en" class="active">EN</button><button data-lang="es">ES</button><button data-size="small">A−</button><button data-size="normal" class="active">A</button><button data-size="large">A+</button></header><nav id="nav"></nav><main id="main"></main><footer class="footer"><button id="prev">← Previous</button><div class="score" id="score"></div><button id="next">Next →</button></footer><script>
const QUESTIONS=[{"en": "Which three parts do most plants have?", "es": "¿Qué tres partes tienen la mayoría de las plantas?", "options": {"en": ["Roots, stem and leaves", "Flowers, fruits and seeds", "Rocks, water and soil"], "es": ["Raíces, tallo y hojas", "Flores, frutos y semillas", "Piedras, agua y tierra"]}, "ans": 0}, {"en": "Which part absorbs water from the soil?", "es": "¿Qué parte absorbe agua del suelo?", "options": {"en": ["Leaves", "Roots", "Stem"], "es": ["Hojas", "Raíces", "Tallo"]}, "ans": 1}, {"en": "Which part is generally green?", "es": "¿Qué parte es generalmente verde?", "options": {"en": ["Roots", "Stem", "Leaves"], "es": ["Raíces", "Tallo", "Hojas"]}, "ans": 2}, {"en": "What does the stem do?", "es": "¿Qué hace el tallo?", "options": {"en": ["Supports the plant and carries water", "Makes the soil", "Holds rocks"], "es": ["Sostiene la planta y transporta agua", "Produce tierra", "Sujeta piedras"]}, "ans": 0}, {"en": "What keeps the plant anchored in the soil?", "es": "¿Qué mantiene la planta sujeta al suelo?", "options": {"en": ["Leaves", "Roots", "Flowers"], "es": ["Hojas", "Raíces", "Flores"]}, "ans": 1}, {"en": "Which part makes food for the plant?", "es": "¿Qué parte fabrica alimento para la planta?", "options": {"en": ["Stem", "Roots", "Leaves"], "es": ["Tallo", "Raíces", "Hojas"]}, "ans": 2}, {"en": "A plant needs water from the soil. Which part takes it in?", "es": "Una planta necesita agua del suelo. ¿Qué parte la absorbe?", "options": {"en": ["Roots", "Leaves", "Flowers"], "es": ["Raíces", "Hojas", "Flores"]}, "ans": 0}, {"en": "How can we classify plants in this lesson?", "es": "¿Cómo clasificamos las plantas en esta lección?", "options": {"en": ["By their flowers", "By their stems", "By their colour"], "es": ["Por sus flores", "Por sus tallos", "Por su color"]}, "ans": 1}, {"en": "Which plant group has soft, thin, flexible stems?", "es": "¿Qué grupo tiene tallos blandos, finos y flexibles?", "options": {"en": ["Trees", "Bushes", "Grasses"], "es": ["Árboles", "Arbustos", "Hierbas"]}, "ans": 2}, {"en": "Which group often has many thick, hard stems?", "es": "¿Qué grupo suele tener muchos tallos gruesos y duros?", "options": {"en": ["Bushes", "Grasses", "Trees"], "es": ["Arbustos", "Hierbas", "Árboles"]}, "ans": 0}, {"en": "What is the thick, hard stem of a tree called?", "es": "¿Cómo se llama el tallo grueso y duro de un árbol?", "options": {"en": ["Leaf", "Trunk", "Root"], "es": ["Hoja", "Tronco", "Raíz"]}, "ans": 1}, {"en": "Which group has one thick, hard trunk?", "es": "¿Qué grupo tiene un tronco grueso y duro?", "options": {"en": ["Grasses", "Bushes", "Trees"], "es": ["Hierbas", "Arbustos", "Árboles"]}, "ans": 2}, {"en": "Which is an example of a grass?", "es": "¿Cuál es un ejemplo de hierba?", "options": {"en": ["Wheat", "Oak", "Rose bush"], "es": ["Trigo", "Roble", "Rosal"]}, "ans": 0}, {"en": "Which is an example of a bush?", "es": "¿Cuál es un ejemplo de arbusto?", "options": {"en": ["Pine", "Lavender", "Rice"], "es": ["Pino", "Lavanda", "Arroz"]}, "ans": 1}, {"en": "Which is an example of a tree?", "es": "¿Cuál es un ejemplo de árbol?", "options": {"en": ["Grass", "Holly", "Apple tree"], "es": ["Hierba", "Acebo", "Manzano"]}, "ans": 2}, {"en": "A plant has a thin, flexible stem. What is it most likely?", "es": "Una planta tiene un tallo fino y flexible. ¿Qué es probablemente?", "options": {"en": ["A grass", "A tree", "A bush with hard stems"], "es": ["Una hierba", "Un árbol", "Un arbusto de tallos duros"]}, "ans": 0}, {"en": "A plant has many thick, hard stems. Which group fits best?", "es": "Una planta tiene muchos tallos gruesos y duros. ¿Qué grupo encaja mejor?", "options": {"en": ["Grasses", "Bushes", "Trees"], "es": ["Hierbas", "Arbustos", "Árboles"]}, "ans": 1}, {"en": "What carries water from roots to leaves?", "es": "¿Qué transporta agua desde las raíces hasta las hojas?", "options": {"en": ["Flowers", "Soil", "Stem"], "es": ["Flores", "Tierra", "Tallo"]}, "ans": 2}, {"en": "Which pair belongs to the same group?", "es": "¿Qué pareja pertenece al mismo grupo?", "options": {"en": ["Oak and pine", "Rice and rose bush", "Wheat and apple tree"], "es": ["Roble y pino", "Arroz y rosal", "Trigo y manzano"]}, "ans": 0}, {"en": "A plant has a single thick trunk. Is it a grass, bush or tree?", "es": "Una planta tiene un único tronco grueso. ¿Es hierba, arbusto o árbol?", "options": {"en": ["Grass", "Tree", "Bush"], "es": ["Hierba", "Árbol", "Arbusto"]}, "ans": 1}];let lang='en',size='normal',page=0;const solved=new Set();const T={en:{nav:['Start','Plant parts','Parts challenge','Plant groups','Groups challenge','Examples','Final Quest','Results'],prev:'← Previous',next:'Next →',yes:'⭐ Correct! Great job!',no:'Try again!',start:'Welcome to Plant Quest!',sub:'Learn about plant parts and plant groups. Answer 20 questions and collect stars!',parts:'Remember the parts of a plant',groups:'Remember the three plant groups',examples:'Some examples',final:'Final Quest',results:'Quest completed!',resulttext:'You can revisit any challenge to earn more stars.',retry:'Start again',score:'Stars',facts:[['Roots','Anchor the plant and absorb water from the soil.'],['Stem','Supports the plant and carries water to the leaves.'],['Leaves','Generally green; make food for the plant.']],groupsfacts:[['Grasses','Soft, thin, flexible stems.'],['Bushes','Often many thick, hard stems.'],['Trees','One thick, hard stem called a trunk.']]},es:{nav:['Inicio','Partes','Reto de partes','Grupos','Reto de grupos','Ejemplos','Reto final','Resultados'],prev:'← Anterior',next:'Siguiente →',yes:'⭐ ¡Correcto! ¡Muy bien!',no:'¡Inténtalo de nuevo!',start:'¡Bienvenidos a Plant Quest!',sub:'Aprende las partes y los grupos de plantas. Responde 20 preguntas y consigue estrellas.',parts:'Recuerda las partes de una planta',groups:'Recuerda los tres grupos de plantas',examples:'Algunos ejemplos',final:'Reto final',results:'¡Misión completada!',resulttext:'Puedes volver a cualquier reto para conseguir más estrellas.',retry:'Volver a empezar',score:'Estrellas',facts:[['Raíces','Sujetan la planta y absorben agua del suelo.'],['Tallo','Sostiene la planta y transporta agua hasta las hojas.'],['Hojas','Generalmente verdes; fabrican alimento para la planta.']],groupsfacts:[['Hierbas','Tallos blandos, finos y flexibles.'],['Arbustos','Suelen tener muchos tallos gruesos y duros.'],['Árboles','Un tallo grueso y duro llamado tronco.']]}};
function tr(k){return T[lang][k]}function card(n){const q=QUESTIONS[n];return `<div class="qcard"><h2>${n+1}. ${q[lang]}</h2><div class="opts">${q.options[lang].map((o,j)=>`<button data-q="${n}" data-opt="${j}" class="${solved.has(n)&&q.ans===j?'correct':''}">${o}</button>`).join('')}</div><div class="feedback" id="fb${n}">${solved.has(n)?tr('yes'):''}</div></div>`}function qs(nums){return `<div class="questions">${nums.map(card).join('')}</div>`}function summary(arr){return `<div class="summary">${arr.map(([a,b])=>`<article><h2>${a}</h2>${b}</article>`).join('')}</div>`}function render(){let pages=[`<div class="hero"><div class="emoji">🌱 🍃 🌳</div><h1>${tr('start')}</h1><p class="intro">${tr('sub')}</p></div>`,`<span class="eyebrow">READ → THINK</span><h1>${tr('parts')}</h1>${summary(tr('facts'))}${qs([0,1])}`,`<span class="eyebrow">ANSWER → PRACTICE</span><h1>${tr('nav')[2]}</h1>${qs([2,3,4,5,6])}`,`<span class="eyebrow">READ → THINK</span><h1>${tr('groups')}</h1>${summary(tr('groupsfacts'))}${qs([7,8])}`,`<span class="eyebrow">ANSWER → PRACTICE</span><h1>${tr('nav')[4]}</h1>${qs([9,10,11])}`,`<span class="eyebrow">OBSERVE → ANSWER</span><h1>${tr('examples')}</h1>${summary(lang==='en'?[['Grasses','Grass · Rice · Wheat'],['Bushes','Rose bush · Lavender · Holly'],['Trees','Oak · Pine · Apple tree']]:[['Hierbas','Hierba · Arroz · Trigo'],['Arbustos','Rosal · Lavanda · Acebo'],['Árboles','Roble · Pino · Manzano']])}${qs([12,13,14])}`,`<span class="eyebrow">FINAL CHALLENGE</span><h1>🏆 ${tr('final')}</h1>${qs([15,16,17,18,19])}`,`<div class="hero"><div class="emoji">🏆 🌿 ⭐</div><h1>${tr('results')}</h1><p class="intro">${tr('resulttext')}</p><h2>${tr('score')}: ${solved.size} / ${QUESTIONS.length}</h2><button id="restart">${tr('retry')}</button></div>`];document.getElementById('main').innerHTML=pages.map((s,i)=>`<section class="slide ${page===i?'active':''}">${s}</section>`).join('');document.getElementById('nav').innerHTML=tr('nav').map((s,i)=>`<button data-page="${i}" class="${i===page?'active':''}">${i+1}. ${s}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(+b.dataset.page));document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>answer(+b.dataset.q,+b.dataset.opt));document.getElementById('prev').textContent=tr('prev');document.getElementById('next').textContent=tr('next');document.getElementById('prev').disabled=page===0;document.getElementById('next').disabled=page===7;document.getElementById('score').textContent=`${page+1}/8 · ⭐ ${solved.size}/20`;document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('active',b.dataset.size===size));let r=document.getElementById('restart');if(r)r.onclick=()=>{solved.clear();go(0)}}function answer(n,j){let f=document.getElementById('fb'+n);if(solved.has(n))return;if(j===QUESTIONS[n].ans){solved.add(n);f.textContent=tr('yes');f.className='feedback good';document.querySelectorAll(`[data-q="${n}"]`).forEach(b=>b.classList.toggle('correct',+b.dataset.opt===j));document.getElementById('score').textContent=`${page+1}/8 · ⭐ ${solved.size}/20`}else{f.textContent=tr('no');f.className='feedback bad'}}function go(n){page=Math.max(0,Math.min(7,n));render();document.getElementById('main').scrollTop=0}document.getElementById('prev').onclick=()=>go(page-1);document.getElementById('next').onclick=()=>go(page+1);document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;document.documentElement.lang=lang;render()});document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{size=b.dataset.size;document.documentElement.style.setProperty('--fs',{small:'17px',normal:'21px',large:'32px'}[size]);document.body.classList.toggle('large',size==='large');render()});render();
</script></body></html>
